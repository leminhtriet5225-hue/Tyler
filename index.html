<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tyler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#1f3bff; --ink:#f6ff8a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    display: grid;
    place-items: center;
    overflow: hidden;
    cursor: none;
    touch-action: none;
    font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  }
  h1 {
    display: flex;
    font-size: min(24vw, 26rem);
    line-height: 1;
    font-weight: 400;
    letter-spacing: -0.03em;
    user-select: none;
    padding-inline: 2vw;
  }
  h1 span {
    display: inline-block;
    font-variation-settings: "wght" 200, "wdth" 75;
    will-change: transform, font-variation-settings;
  }
  .blob {
    position: fixed; left: 0; top: 0;
    width: 22vmax; height: 22vmax;
    margin: -11vmax 0 0 -11vmax;
    border-radius: 50%;
    background: #fff;
    mix-blend-mode: difference;
    pointer-events: none;
    will-change: transform;
  }
  @media (hover: none) { .blob { opacity: .0; } }
  @media (prefers-reduced-motion: reduce) { .blob { display: none; } }

  .top {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 1.5rem; padding: 1.4rem 3vw;
    font-size: clamp(.85rem, 1.6vw, 1.15rem);
    line-height: 1.35;
    font-variation-settings: "wght" 400, "wdth" 90;
  }
  .top h2 {
    font-size: 1.9em; line-height: 1; margin-bottom: .35em;
    font-variation-settings: "wght" 800, "wdth" 75;
    letter-spacing: -0.02em;
  }
  .dream { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
  .dream-row { display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap; justify-content: flex-end; }
  .spark { width: clamp(80px, 16vw, 160px); height: auto; overflow: visible; }
  .spark path {
    fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 220; stroke-dashoffset: 220;
    animation: climb 4s cubic-bezier(.3,.7,.2,1) infinite;
  }
  @keyframes climb { 0% { stroke-dashoffset: 220; } 60%, 100% { stroke-dashoffset: 0; } }
  .bank b { font-variation-settings: "wght" 800, "wdth" 85; font-variant-numeric: tabular-nums; }
  .name {
    position: fixed; bottom: 1.4rem; left: 0; right: 0; text-align: center;
    font-size: clamp(1.2rem, 3vw, 2rem);
    font-variation-settings: "wght" 600, "wdth" 80;
    letter-spacing: .01em;
  }
  @media (prefers-reduced-motion: reduce) { .spark path { animation: none; stroke-dashoffset: 0; } }

  .top { z-index: 5; }
  .blob { z-index: 100; }

  /* Football button */
  .ball {
    all: unset; cursor: none; position: relative;
    display: inline-flex; align-items: center; gap: .5em;
    font-size: 1.5em; padding: .3em .9em .3em .6em;
    border: 2px solid var(--ink); border-radius: 999px;
    font-variation-settings: "wght" 700, "wdth" 80;
  }
  .ball::after {
    content: ""; position: absolute; inset: -2px; border-radius: 999px;
    border: 2px solid var(--ink); animation: ring 1.8s ease-out infinite;
  }
  .ball::before {
    content: "✦"; position: absolute; top: -.55em; right: -.1em; font-size: .8em;
    animation: twinkle 1.4s ease-in-out infinite;
  }
  .ball:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
  .ico { display: inline-block; animation: spin 6s linear infinite; }
  .hint { margin-top: .6em; opacity: .8; }
  @keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(1.4, 1.7); opacity: 0; } }
  @keyframes twinkle { 0%, 100% { transform: scale(.2) rotate(0); opacity: 0; } 50% { transform: scale(1.2) rotate(90deg); opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* GOAL banner */
  .banner {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    clip-path: circle(0px at 50% 50%);
    display: grid; place-items: center; overflow: hidden;
  }
  .group { width: 130vw; transform: rotate(-5deg); display: flex; flex-direction: column; box-shadow: 0 24px 70px rgba(0,0,0,.5); }
  .tape { background: #ff3d81; color: #fff; overflow: hidden; white-space: nowrap; padding: .25em 0; font-size: clamp(1rem, 3vw, 1.8rem); font-variation-settings: "wght" 800, "wdth" 80; }
  .run { display: inline-block; animation: run 14s linear infinite; }
  .rev .run { animation-direction: reverse; }
  @keyframes run { to { transform: translateX(-50%); } }
  .ribbon { background: var(--ink); color: var(--bg); display: flex; justify-content: center; font-size: min(15vw, 10rem); line-height: 1.05; }
  .ribbon span { display: inline-block; animation: hop .6s ease-in-out infinite alternate; animation-delay: calc(var(--i) * .07s); }
  @keyframes hop {
    from { transform: translateY(0); font-variation-settings: "wght" 300, "wdth" 75; }
    to { transform: translateY(-.12em); font-variation-settings: "wght" 800, "wdth" 100; }
  }

  /* UFO */
  .ufo {
    all: unset; --s: clamp(70px, 12vw, 130px);
    position: fixed; left: 0; top: 0; width: var(--s); margin: calc(var(--s) / -2 * .6) 0 0 calc(var(--s) / -2);
    z-index: 2; cursor: none; will-change: transform;
  }
  .ufo:focus-visible { outline: 3px solid #fff; outline-offset: 6px; }
  .ufo svg { display: block; width: 100%; height: auto; overflow: visible; }
  .beam { animation: beam 1.1s ease-in-out infinite alternate; }
  @keyframes beam { from { opacity: .2; } to { opacity: .8; } }
  .lights circle { animation: blink 1s steps(2) infinite; }
  .lights circle:nth-child(2n) { animation-delay: .5s; }
  @keyframes blink { 50% { opacity: .2; } }

  /* Effects */
  .p, .ring, .boom, .flash { position: fixed; pointer-events: none; }
  .p { left: 0; top: 0; z-index: 30; line-height: 1; }
  .ring { width: 40px; height: 40px; border: 4px solid; border-radius: 50%; z-index: 29; }
  .boom { z-index: 31; font-size: clamp(2rem, 8vw, 5rem); color: #fff; text-shadow: 0 0 20px #ff3d81, 0 0 40px #ff9f1c; font-variation-settings: "wght" 800, "wdth" 85; }
  .flash { inset: 0; background: #fff; z-index: 40; }
  @media (prefers-reduced-motion: reduce) {
    .run, .ribbon span, .ball::after, .ball::before, .ico, .beam, .lights circle { animation: none; }
  }
</style>
</head>
<body>
<h1 aria-label="Tyler"><span>T</span><span>y</span><span>l</span><span>e</span><span>r</span></h1>
<header class="top">
  <section>
    <h2>Hobby</h2>
    <button class="ball" id="football" data-stop><span class="ico">⚽</span>Football</button>
    <p class="hint">Tap the ball</p>
  </section>
  <section class="dream">
    <h2>Dream</h2>
    <div class="dream-row">
      <div>
        <p>Stocks to the sky</p>
        <svg class="spark" viewBox="0 0 120 44" aria-hidden="true"><path d="M2 40 L16 33 L28 36 L42 24 L54 28 L70 15 L82 19 L98 7 L118 3"/></svg>
      </div>
      <p class="bank">My bank account<br><b id="bank">$53,000,000</b></p>
    </div>
  </section>
</header>
<footer class="name">Minhtriett</footer>
<div class="blob" aria-hidden="true"></div>
<script>
(() => {
  const el = document.getElementById("bank"), end = 53000000;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const t0 = performance.now(), dur = 2800;
  (function tick(t) {
    const p = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - p, 4);
    el.textContent = "$" + Math.round(end * e).toLocaleString("en-US");
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
})();
</script>

<script>
(() => {
  const letters = [...document.querySelectorAll("h1 span")];
  const blob = document.querySelector(".blob");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const st = letters.map(() => ({ k: 0 }));
  let px = innerWidth / 2, py = innerHeight / 2, bx = px, by = py, active = false, last = 0;

  addEventListener("pointermove", e => { px = e.clientX; py = e.clientY; active = true; last = performance.now(); });
  addEventListener("pointerleave", () => { active = false; });

  // Click: letters flip in a staggered wave
  addEventListener("pointerdown", e => {
    if (still || e.target.closest("[data-stop]")) return;
    letters.forEach((el, i) => el.animate(
      [{ transform: "rotateX(0) scale(1)" },
       { transform: "rotateX(360deg) scale(1.25)", offset: .55 },
       { transform: "rotateX(720deg) scale(1)" }],
      { duration: 900, delay: i * 70, easing: "cubic-bezier(.2,.9,.2,1)" }
    ));
  });

  function frame(t) {
    const time = t / 1000;
    const idle = !active || t - last > 2500;
    letters.forEach((el, i) => {
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      let target;
      if (idle || still) {
        // slow breathing wave travelling through the word
        target = still ? 0.5 : (Math.sin(time * 1.4 - i * 0.9) + 1) / 2;
      } else {
        const d = Math.hypot(px - cx, py - cy);
        const s = Math.min(innerWidth, 1100) * 0.28;
        target = Math.exp(-(d * d) / (2 * s * s));
      }
      const s = st[i];
      s.k += (target - s.k) * 0.12;
      const k = s.k;
      const dir = (px - cx) / innerWidth;
      const wght = 200 + 600 * k;
      const wdth = 75 + 25 * k;
      const lift = still ? 0 : -k * 5;
      const rot = still ? 0 : (idle ? Math.sin(time * 1.4 - i * 0.9) * 4 : dir * -14 * k);
      el.style.fontVariationSettings = `"wght" ${wght.toFixed(0)}, "wdth" ${wdth.toFixed(0)}`;
      if (!el.getAnimations().length)
        el.style.transform = `translateY(${lift}vmin) rotate(${rot.toFixed(2)}deg)`;
    });
    bx += (px - bx) * 0.14; by += (py - by) * 0.14;
    blob.style.transform = `translate(${bx}px, ${by}px) scale(${active ? 1 : 0.6})`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<div class="banner" id="banner" aria-hidden="true">
  <div class="group">
    <div class="tape"><div class="run" data-run></div></div>
    <div class="ribbon" id="ribbon"></div>
    <div class="tape rev"><div class="run" data-run></div></div>
  </div>
</div>

<button class="ufo" id="ufo" data-stop aria-label="UFO">
  <svg viewBox="0 0 120 80" aria-hidden="true">
    <defs><linearGradient id="bm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
    <polygon class="beam" points="46,46 74,46 104,80 16,80" fill="url(#bm)"/>
    <path d="M36 36 Q60 -8 84 36Z" fill="#8ff5ff"/>
    <ellipse cx="60" cy="38" rx="56" ry="14" fill="#fff"/>
    <ellipse cx="60" cy="43" rx="42" ry="6" fill="#c3c8ff"/>
    <g class="lights">
      <circle cx="20" cy="38" r="4" fill="#ff3d81"/><circle cx="40" cy="43" r="4" fill="#ffb02e"/>
      <circle cx="60" cy="45" r="4" fill="#ff3d81"/><circle cx="80" cy="43" r="4" fill="#ffb02e"/>
      <circle cx="100" cy="38" r="4" fill="#ff3d81"/>
    </g>
  </svg>
</button>

<script>
(() => {
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const COLORS = ["#f6ff8a", "#fff", "#ff3d81", "#7cf4ff", "#ffb02e"];
  const add = (cls, css = "", text = "") => {
    const el = document.createElement("div");
    el.className = cls; el.style.cssText = css; el.textContent = text;
    document.body.appendChild(el); return el;
  };

  function burst(x, y, o = {}) {
    const { n = 30, glyph = null, dist = [80, 260], dur = [700, 1300], size = [6, 14], inward = false, gravity = 0 } = o;
    for (let i = 0; i < n; i++) {
      const s = rnd(...size), c = COLORS[i % COLORS.length];
      const el = glyph
        ? add("p", `font-size:${s * 1.6}px;color:${c}`, glyph)
        : add("p", `width:${s}px;height:${s}px;background:${c};border-radius:${Math.random() < .5 ? "50%" : "2px"}`);
      const a = rnd(0, Math.PI * 2), d = rnd(...dist);
      const dx = Math.cos(a) * d, dy = Math.sin(a) * d + gravity;
      const far = `translate(${x + dx}px,${y + dy}px)`, mid = `translate(${x}px,${y}px)`;
      el.animate(
        inward
          ? [{ transform: far + " scale(.4)", opacity: 0 }, { transform: mid + " scale(1.2)", opacity: 1 }]
          : [{ transform: mid + " scale(1)", opacity: 1 }, { transform: far + ` scale(0) rotate(${rnd(-540, 540)}deg)`, opacity: 0 }],
        { duration: rnd(...dur), delay: rnd(0, inward ? 400 : 60), fill: "both",
          easing: inward ? "cubic-bezier(.5,0,.9,.4)" : "cubic-bezier(.1,.8,.3,1)" }
      ).onfinish = () => el.remove();
    }
  }
  function ring(x, y, color, size, delay = 0) {
    const el = add("ring", `left:${x}px;top:${y}px;border-color:${color}`);
    el.animate([{ transform: "translate(-50%,-50%) scale(.05)", opacity: 1 }, { transform: `translate(-50%,-50%) scale(${size / 40})`, opacity: 0 }],
      { duration: 900, delay, easing: "cubic-bezier(.1,.8,.3,1)", fill: "both" }).onfinish = () => el.remove();
  }
  function shake(amp, ms) {
    document.body.animate(Array.from({ length: 12 }, (_, i) => ({
      transform: `translate(${rnd(-amp, amp) * (1 - i / 12)}px,${rnd(-amp, amp) * (1 - i / 12)}px)`
    })), { duration: ms });
  }
  function flash() {
    const el = add("flash");
    el.animate([{ opacity: .85 }, { opacity: 0 }], { duration: 450 }).onfinish = () => el.remove();
  }
  function rain(n) {
    for (let i = 0; i < n; i++) {
      const x = rnd(0, innerWidth), c = COLORS[i % COLORS.length];
      const el = add("p", `width:${rnd(6, 12)}px;height:${rnd(10, 18)}px;background:${c}`);
      el.animate([{ transform: `translate(${x}px,-30px) rotate(0)` },
        { transform: `translate(${x + rnd(-120, 120)}px,${innerHeight + 40}px) rotate(${rnd(-900, 900)}deg)` }],
        { duration: rnd(1800, 3200), delay: rnd(0, 900), easing: "cubic-bezier(.3,.1,.6,1)", fill: "both" }).onfinish = () => el.remove();
    }
  }

  /* ---- Football: sparkles + GOAL banner ---- */
  const fb = document.getElementById("football");
  const banner = document.getElementById("banner");
  const ribbon = document.getElementById("ribbon");
  [..."GOALLLLLL!"].forEach((ch, i) => {
    const s = document.createElement("span"); s.style.setProperty("--i", i); s.textContent = ch; ribbon.appendChild(s);
  });
  document.querySelectorAll("[data-run]").forEach((r, i) => r.textContent = (i ? "GOAL ⚽ " : "GOAL ⚽ ").repeat(48));
  let on = false;
  fb.addEventListener("click", () => {
    const r = fb.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    burst(x, y, { n: 34, glyph: "✦", dist: [40, 220], size: [8, 18], dur: [600, 1100] });
    burst(x, y, { n: 24, dist: [40, 180], size: [3, 7], dur: [500, 900] });
    if (on) return; on = true;
    const at = `${x}px ${y}px`;
    const open = banner.animate([{ clipPath: `circle(0px at ${at})` }, { clipPath: `circle(150vmax at ${at})` }],
      { duration: 900, easing: "cubic-bezier(.7,0,.2,1)", fill: "forwards" });
    setTimeout(() => { shake(10, 500); rain(80); burst(innerWidth * .15, innerHeight / 2, { n: 30, glyph: "✦", dist: [80, 300] }); burst(innerWidth * .85, innerHeight / 2, { n: 30, glyph: "✦", dist: [80, 300] }); }, 700);
    setTimeout(() => {
      open.cancel();
      const close = banner.animate([{ clipPath: `circle(150vmax at ${at})` }, { clipPath: `circle(0px at ${at})` }],
        { duration: 700, easing: "cubic-bezier(.7,0,.2,1)", fill: "forwards" });
      close.onfinish = () => { close.cancel(); on = false; };
    }, 4200);
  });

  /* ---- UFO: orbit, explode, respawn ---- */
  const ufo = document.getElementById("ufo"), ufoSvg = ufo.querySelector("svg");
  let phase = 0, last = performance.now(), alive = true, ux = 0, uy = 0, tilt = 0;
  const pos = p => [innerWidth / 2 + innerWidth * .4 * Math.cos(p), innerHeight / 2 + innerHeight * .3 * Math.sin(p) + innerHeight * .03 * Math.sin(p * 3)];
  (function loop(t) {
    const dt = Math.min((t - last) / 1000, .05); last = t;
    if (alive && !still) phase += dt * (0.85 + 0.25 * Math.sin(t / 1500));
    const [x, y] = pos(still ? 5.5 : phase);
    tilt += ((x - ux) * 3 - tilt) * .1; ux = x; uy = y;
    ufo.style.transform = `translate(${x}px,${y}px) rotate(${Math.max(-18, Math.min(18, tilt))}deg)`;
    requestAnimationFrame(loop);
  })(last);

  ufo.addEventListener("click", () => {
    if (!alive) return; alive = false;
    const x = ux, y = uy;
    ufo.style.visibility = "hidden";
    flash(); shake(14, 600);
    ring(x, y, "#fff", 700); ring(x, y, "#ff3d81", 1100, 120);
    burst(x, y, { n: 46, dist: [100, 420], dur: [800, 1600], gravity: 160 });
    burst(x, y, { n: 16, glyph: "✦", dist: [60, 300], size: [8, 16] });
    const b = add("boom", `left:${x}px;top:${y}px`, "BOOM!");
    b.animate([{ transform: "translate(-50%,-50%) scale(.2)", opacity: 1 }, { transform: "translate(-50%,-90%) scale(1.4)", opacity: 1, offset: .35 }, { transform: "translate(-50%,-130%) scale(1.6)", opacity: 0 }],
      { duration: 1400, easing: "ease-out" }).onfinish = () => b.remove();
    setTimeout(() => {
      burst(x, y, { n: 40, inward: true, dist: [140, 360], dur: [700, 900] });
      setTimeout(() => {
        ufo.style.visibility = "visible";
        ufoSvg.animate([
          { transform: "scale(0) rotate(-720deg)", filter: "brightness(4)" },
          { transform: "scale(1.25) rotate(20deg)", filter: "brightness(2)", offset: .7 },
          { transform: "scale(1) rotate(0)", filter: "brightness(1)" }],
          { duration: 900, easing: "cubic-bezier(.2,.9,.2,1.1)" });
        ring(x, y, "#7cf4ff", 320);
        burst(x, y, { n: 14, glyph: "✦", dist: [40, 170] });
        alive = true;
      }, 850);
    }, 2300);
  });
})();
</script>
</body>
</html>
